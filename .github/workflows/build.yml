name: Build Android APK (Online)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compila APK Online
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa le dipendenze
        run: npm install

      - name: Genera icone Web dal logo originale SlidingChat
        run: node scripts/generate-icons.mjs --web

      - name: Genera build del sito web (Vite)
        run: npm run build

      - name: Inizializza e Sincronizza Capacitor Android + Icone APK
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
            }
            if (!xml.includes("ACCESS_FINE_LOCATION")) {
              const perms = `
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-feature android:name="android.hardware.location.gps" android:required="false" />
</manifest>`;
              xml = xml.replace("</manifest>", perms);
            }
            fs.writeFileSync(p, xml, "utf8");
          '
          node scripts/generate-icons.mjs --android

      - name: Compila APK (Gradle)
        run: |
          cd android
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Carica APK come Artefatto Scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: SlidingChat-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
